version: 2
updates:
  - package-ecosystem: npm # also handles yarn.lock
    directory: /
    schedule:
      interval: weekly
    # Yarn refuses versions younger than a day (npmMinimalAgeGate); wait a bit longer
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
