name: Release

on:
  # Called by release-please after it creates a release
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # Manual (re)build of an existing tag
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.1.0
        type: string
        required: true
  # A tag pushed by hand still builds a release
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: yarn test
      - run: yarn build

      - name: Attach installer to the GitHub release
        shell: bash
        run: |
          files=(release/*/SnowballTracker-Windows-*-Setup.exe)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
          fi
