name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Checks don't run Electron, so skip the ~100 MB binary download
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test
      - name: Build renderer and Electron bundles
        run: yarn vite build
